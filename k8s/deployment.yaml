apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-ledger-api
  labels:
    app: payment-ledger-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payment-ledger-api
  template:
    metadata:
      labels:
        app: payment-ledger-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: payment-ledger-api
          # Replace with the real registry image before deploying.
          image: payment-ledger-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: payment-ledger-api-config
            - secretRef:
                name: payment-ledger-api-secret
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
