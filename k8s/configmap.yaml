apiVersion: v1
kind: ConfigMap
metadata:
  name: payment-ledger-api-config
  labels:
    app: payment-ledger-api
data:
  # Non-secret configuration only. The database password lives in the
  # Secret (k8s/secret.yaml), never here, and the URL below carries no
  # credentials.
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/ledger"
  SERVER_PORT: "8080"
  SPRING_PROFILES_ACTIVE: "prod"
